name: Offline validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: All platform offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      CHECK_URLS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Install pinned validation dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          npm ci --ignore-scripts
      - name: Install Bicep 0.48.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bicep-tools"
          gh release download v0.48.1 --repo Azure/bicep --pattern bicep-linux-x64 --dir "$RUNNER_TEMP/bicep-tools"
          cd "$RUNNER_TEMP/bicep-tools"
          echo 'b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  bicep-linux-x64' | sha256sum --check
          mv bicep-linux-x64 bicep
          chmod +x bicep
          echo "$RUNNER_TEMP/bicep-tools" >> "$GITHUB_PATH"
      - name: Validate all three packs
        run: bash tools/validate_all.sh
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-validation-${{ github.sha }}
          path: artifacts/*.txt
          if-no-files-found: warn
          retention-days: 30
